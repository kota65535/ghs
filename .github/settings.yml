# The file is the repository. Its top level is the body of
# PATCH /repos/{owner}/{repo}, so the fields of that request are written here
# directly, and anything GitHub reaches through a longer path goes under a key
# named after it.
#
# Fields left out of this file are not managed: ghs never touches them.
description: Manage GitHub repository settings from a settings file
has_issues: true
has_projects: false
has_wiki: false
has_discussions: false

allow_squash_merge: true
allow_merge_commit: false
allow_rebase_merge: false
allow_auto_merge: true
allow_update_branch: true
delete_branch_on_merge: true

squash_merge_commit_title: PR_TITLE
squash_merge_commit_message: PR_BODY

web_commit_signoff_required: false

# /repos/{owner}/{repo}/actions -- a path segment with no settings of its own.
actions:
  # .../actions/permissions
  #
  # default_workflow_permissions is the reason this is worth declaring: it
  # decides whether every workflow runs with a token that can write to the
  # repository, and it is a single click away in the web interface.
  permissions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: false

    # .../actions/permissions/workflow
    workflow:
      default_workflow_permissions: read
      can_approve_pull_request_reviews: false

    # .../actions/permissions/fork-pr-contributor-approval
    fork-pr-contributor-approval:
      approval_policy: first_time_contributors

    # .../actions/permissions/artifact-and-log-retention
    #
    # "days" says nothing on its own; under the key naming the endpoint that
    # writes it, it does. That is the whole reason the file follows the paths.
    artifact-and-log-retention:
      days: 90

# Keys holding a sequence are collections: a set of named things rather than
# one object. Each entry is the body that creates one, with name identifying it.
#
# Declaring such a key puts the WHOLE set under management. An entry GitHub has
# and this file does not is deleted, which the plan shows as a removal before
# anything is sent. Leave a key out and ghs does not touch those settings at
# all.

# .../rulesets
rulesets:
  - name: example
    target: branch
    # evaluate records violations without blocking them. Switch to active to
    # have the rules enforced.
    enforcement: evaluate
    conditions:
      ref_name:
        include: ['~DEFAULT_BRANCH']
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        # These five parameters are all required together. A rule is described
        # as a choice between two dozen shapes, so which fields one takes is
        # left to the API to judge -- leave one out and the request comes back
        # as "data matches no possible input" rather than as a named field.
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false

# .../environments/{name}
environments:
  - name: example
    wait_timer: 0

    # .../environments/{name}/variables
    #
    # Values appear in the plan as they are. A variable is where GitHub puts
    # configuration that is not secret, and hiding the values would take the
    # point out of reviewing a change to one. Secrets belong elsewhere: ghs
    # does not manage them.
    variables:
      - name: DEPLOY_REGION
        value: us-east-1
