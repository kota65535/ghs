name: codegen

# This runs on every pull request rather than only the ones that touch the
# generator, because a required status check has to report on all of them:
# one that never starts leaves the pull request waiting forever. Regenerating
# downloads a 13 MB API description but still finishes in a few seconds.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Renovate only moves the pinned commit; the regenerated output has to
          # be pushed back onto its branch, and only a personal access token
          # makes that push retrigger the checks the auto-merge waits on.
          token: ${{ github.actor == 'renovate[bot]' && secrets.RELEASE_TOKEN || github.token }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Regenerate
        run: go generate ./...

      - name: Commit the regenerated output onto the Renovate branch
        if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: regenerate the node definitions'
          git push

      - name: Check the committed output matches
        run: |
          if ! git diff --exit-code; then
            echo
            echo "The generated node definitions are out of date."
            echo "Run 'go generate ./...' and commit the result."
            exit 1
          fi
